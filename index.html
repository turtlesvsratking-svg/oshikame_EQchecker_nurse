<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>心状態チェッカー</title>
    
    <link rel="apple-touch-icon" href="IMG_4227.png">
    <link rel="icon" type="image/png" href="IMG_4227.png">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>心状態チェッカー</h1>
        <p class="subtitle">〜 今の気持ちはどこにある？ 〜</p>
    </header>

    <main>
        <section class="group-config">
            <label for="group-id-input">グループID:</label>
            <input type="text" id="group-id-input" placeholder="例: nurse-team-A">
            <p class="hint">※同じIDを入力したメンバーと記録を共有できます</p>
        </section>

        <section class="mood-selector">
            <div class="axis-label top">身体：元気</div>
            <div class="grid-container">
                <div class="axis-label-side left">心：つらい</div>
                <div id="mood-grid" class="grid"></div>
                <div class="axis-label-side right">心：元気</div>
            </div>
            <div class="axis-label bottom">身体：つらい</div>
        </section>

        <section class="selected-info">
            <div id="selected-display">
                <span id="selected-emotion-jp">感情を選択してね</span>
                <span id="selected-emotion-en" class="en-label"></span>
            </div>
        </section>

        <section class="entry-area">
            <textarea id="memo-input" placeholder="今の状況や、自分への一言（自由入力）"></textarea>
            <button id="save-btn" disabled>今の自分を記録する</button>
        </section>

        <hr>

        <section class="history-section">
            <h2>みんなの履歴</h2>
            <div id="history-list">
                <p class="loading-msg">グループIDを入力すると履歴が表示されます</p>
            </div>
        </section>
    </main>

    <div id="thanks-modal" class="thanks-hidden">
        <div class="thanks-content">
            <img src="IMG_4227.png" alt="カメさん" class="thanks-image">
            <p>クラウドに記録したよ！🐢</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
